<!doctype html>
<html lang="en-US">
	<head>
		<meta charset="UTF-8" />
		<title>Treasurer Login</title>
		<link rel="stylesheet" href="../../css/style.css" />
		<script src="../JS/TreasurerLogin.js"></script>
	</head>

	<body>
		<img src="logo.png" id="logo" />

		<br />
		<br />

		<div class="header">
			<h1>Treasurer Portal</h1>
			<h3>University Club Management System</h3>
		</div>

		<div class="topnav">
			<a href="../index.html"> Home </a>
		</div>

		<p id="demotext"></p>

		<form onsubmit="return collect_login_data();">
			<fieldset>
				<legend>Treasurer Account Login</legend>

				<table>
					<tr>
						<td>
							<label for="TreasurerEmail">
								University Email:
							</label>
						</td>

						<td>
							<input
								type="email"
								id="TreasurerEmail"
								placeholder="Enter your university email"
							/>

							<p id="EmailError"></p>
						</td>
					</tr>

					<tr>
						<td>
							<label for="TreasurerPassword"> Password: </label>
						</td>

						<td>
							<input
								type="password"
								id="TreasurerPassword"
								placeholder="Enter your password"
							/>

							<p id="PasswordError"></p>
						</td>
					</tr>

					<tr>
						<td>
							<label for="RememberMe"> Remember Me: </label>
						</td>

						<td>
							<input
								type="checkbox"
								id="RememberMe"
								name="RememberMe"
								value="Yes"
							/>
						</td>
					</tr>
				</table>
			</fieldset>

			<br />

			<input type="submit" id="submit" value="Login" />

			<input type="reset" id="reset" value="Clear" />
		</form>

		<p id="LoginMessage"></p>

		<div class="footer">
			<h5>University Club Management System</h5>
		</div>
	</body>
</html>
