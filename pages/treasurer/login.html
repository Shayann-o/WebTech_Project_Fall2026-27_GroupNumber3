<!doctype html>
<html lang="en-US">
	<head>
		<meta charset="UTF-8" />
		<title>Treasurer Login</title>
		<link rel="stylesheet" href="../../css/style.css" />
		<script src="../../js/pages/treasurer/login.js"></script>
	</head>

	<body>
		<div class="treasurer-login-header">
			<h1>Club<span style="color: #db2777">Kit</span></h1>
			<h3>Treasurer Login</h3>
		</div>

		<div class="topnav">
			<a href="../../index.html">Home</a>
			<a href="./login.html" class="active">Login</a>
			<a href="./registration.html">Registration</a>
		</div>

		<p id="demotext"></p>

		<form onsubmit="return collect_login_data();">
			<fieldset class="login-fieldset">
				<legend>Treasurer Account Login</legend>

				<table>
					<tr>
						<td>
							<label for="TreasurerEmail">
								University Email:
							</label>
						</td>

						<td>
							<input
								type="email"
								id="TreasurerEmail"
								placeholder="Enter your university email"
							/>

							<p id="EmailError"></p>
						</td>
					</tr>

					<tr>
						<td>
							<label for="TreasurerPassword"> Password: </label>
						</td>

						<td>
							<input
								type="password"
								id="TreasurerPassword"
								placeholder="Enter your password"
							/>

							<p id="PasswordError"></p>
						</td>
					</tr>

					<tr>
						<td>
							<label for="RememberMe"> Remember Me: </label>
						</td>

						<td>
							<input
								type="checkbox"
								id="RememberMe"
								name="RememberMe"
								value="Yes"
							/>
						</td>
					</tr>
				</table>
			</fieldset>

			<br />

			<input type="submit" id="login-submit" value="Login" />

			<input type="reset" id="login-reset" value="Clear" />
		</form>

		<p id="LoginMessage"></p>

		<div class="test-account">
			<h4>Sample Login Credentials</h4>
			<p>treasurer@clubkit.edu</p>
			<p>treasurer123</p>
		</div>

		<div class="footer">
			<p>
				&copy; 2026 ClubKit. Connecting Students Through Clubs &
				Activities. All Rights Reserved.
			</p>
		</div>
	</body>
</html>
