
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Club Events | ClubKit</title>

    <link rel="stylesheet" href="../../css/event-Co/Estyle.css">
</head>

<body class="dashboard-body">

    <div class="dashboard-layout">

        <aside class="sidebar">

            <div class="sidebar-logo">
                <h2>ClubKit</h2>
                <p>Event Coordinator</p>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="active">Create Club Events</a>
                <a href="report.html">Submit Expense Reports</a>
                <a href="update_schedule.html">Update Event Schedules</a>
            </nav>

            <div class="sidebar-bottom">
                <a href="login.html">Log Out</a>
            </div>

        </aside>

        <main class="dashboard-main">

            <div class="dashboard-header">
                <h1>Create Club Events</h1>
                <p>Organize and create new events for your club.</p>
            </div>

            <section class="dashboard-section">

                <div class="section-heading">
                    <h2>Event Information</h2>
                    <p>Provide the necessary details to organize a new event.</p>
                </div>

                <form id="create-event-form" class="dashboard-form">

                    <div class="form-group">
                        <label for="event-name">Event Name</label>
                        <input type="text" id="event-name" name="event_name"
                               placeholder="Enter event name">
                    </div>

                    <div class="form-group">
                        <label for="event-type">Event Type</label>
                        <select id="event-type" name="event_type">
                            <option value="" disabled selected>Select event type</option>
                            <option value="Workshop">Workshop</option>
                            <option value="Seminar">Seminar</option>
                            <option value="Competition">Competition</option>
                            <option value="Cultural">Cultural Program</option>
                            <option value="Sports">Sports</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-row">

                        <div class="form-group">
                            <label for="event-date">Event Date</label>
                            <input type="date" id="event-date" name="event_date">
                        </div>

                        <div class="form-group">
                            <label for="event-time">Event Time</label>
                            <input type="time" id="event-time" name="event_time">
                        </div>

                    </div>

                    <div class="form-group">
                        <label for="event-venue">Venue</label>
                        <input type="text" id="event-venue" name="venue"
                               placeholder="Enter event venue">
                    </div>

                    <div class="form-row">

                        <div class="form-group">
                            <label for="participant-limit">Participant Limit</label>
                            <input type="number" id="participant-limit"
                                   name="participant_limit"
                                   placeholder="Maximum participants">
                        </div>

                        <div class="form-group">
                            <label for="guest-count">Number of Guests</label>
                            <input type="number" id="guest-count"
                                   name="guest_count"
                                   placeholder="Expected guests">
                        </div>

                    </div>

                    <div class="form-group">
                        <label for="guest-details">Guest Information</label>
                        <input type="text" id="guest-details" name="guest_details"
                               placeholder="Enter guest names or designations">
                    </div>

                    <div class="form-group">
                        <label for="event-description">Event Description</label>
                        <textarea id="event-description" name="description"
                                  rows="4"
                                  placeholder="Describe your event..."></textarea>
                    </div>

                    <button type="submit" class="dashboard-btn">
                        Create Event
                    </button>

                </form>

            </section>

        </main>

    </div>

</body>
</html>
