<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Expense Reports | ClubKit</title>
		<script src="../../js/pages/event_coordinator/report.js"></script>
		<link rel="stylesheet" href="../../css/event-Co/Estyle.css" />
	</head>

	<body class="dashboard-body">
		<div class="dashboard-layout">
			<aside class="sidebar">
				<div class="sidebar-logo">
					<h2>ClubKit</h2>
					<p>Event Coordinator</p>
				</div>

				<nav class="sidebar-nav">
					<a href="dashboard.html">Create Club Events</a>
					<a href="report.html" class="active"
						>Submit Expense Reports</a
					>
					<a href="update_schedule.html">Update Event Schedules</a>
					<a href="volunteer_assignment.html">Assign Volunteers</a>
				</nav>

				<div class="sidebar-bottom">
					<a href="login.html">Log Out</a>
				</div>
			</aside>

			<main class="dashboard-main">
				<div class="dashboard-header">
					<h1>Submit Event Expense Reports</h1>
					<p>Record and submit your club event expenses.</p>
				</div>

				<section class="dashboard-section">
					<div class="section-heading">
						<h2>Expense Information</h2>
						<p>Provide the details of your event expenses.</p>
					</div>

					<form id="expense-form" class="dashboard-form" onsubmit="return collect_expense_data()">
						<div class="form-group">
							<label for="expense-event">Select Event</label>
							<select id="expense-event" name="event">
								<option value="" disabled selected>
									Select an event
								</option>
								<option value="Workshop">Workshop</option>
								<option value="Seminar">Seminar</option>
								<option value="Competition">Competition</option>
							</select>
							<p id="EventSelectionError" class="error-message"></p>
						
							<label for="expense-category"
								>Expense Category</label
							>
							<select id="expense-category" name="category">
								<option value="" disabled selected>
									Select category
								</option>
								<option value="Venue">Venue</option>
								<option value="Food">
									Food and Refreshments
								</option>
								<option value="Transportation">
									Transportation
								</option>
								<option value="Decoration">Decoration</option>
								<option value="Equipment">Equipment</option>
								<option value="Other">Other</option>
							</select>
							<p id="ExpenseCategoryError" class="error-message"></p>
						
							
								<label for="expense-amount"
									>Expense Amount (৳)</label
								>
								<input
									type="number"
									id="expense-amount"
									name="amount"
									placeholder="Enter amount"
								/>
								<p id="ExpenseAmountError" class="error-message"></p>
							
								<label for="expense-date">Expense Date</label>
								<input
									type="date"
									id="expense-date"
									name="expense_date"
								/>
								<p id="ExpenseDateError" class="error-message"></p>

						
							<label for="expense-description"
								>Expense Description</label
							>
							<textarea
								id="expense-description"
								name="description"
								rows="4"
								placeholder="Explain the expense..."
							></textarea>
							<p id="ExpenseDescriptionError" class="error-message"></p>
						
							<label for="receipt-reference"
								>Receipt / Invoice Reference</label
							>
							<input
								type="text"
								id="receipt-reference"
								name="receipt_reference"
								placeholder="Enter receipt or invoice number"
							/>
							<p id="ReceiptReferenceError" class="error-message"></p>
						</div>

						<button type="submit" class="dashboard-btn">
							Submit Expense Report
						</button>
					</form>
				</section>
			</main>
		</div>
	</body>
</html>
