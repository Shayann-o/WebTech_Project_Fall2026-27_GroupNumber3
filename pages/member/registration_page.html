
<!DOCTYPE html>
<html>
<head>
    <title>Club Member Registration</title>
    <link rel="stylesheet" href="../../css/member/member.css">
    <script src="../../js/pages/member/registration.js"></script>
</head>
<body>

    <div class="register-container">

        <div class="register-header">
            <h1>Join Our Club</h1>
            <p>Fill in the information to become a club member</p>
        </div>

        <form onsubmit="return collect_registration_data()">

            <div class="form-row">

                <div class="form-group">
                    <label for="club-name">Club Name</label>
                    <input type="text" id="club-name"
                           placeholder="Enter club name">
                    <p id="ClubNameError" class="error-message"></p>
                </div>

                <div class="form-group">
                    <label for="student-id">Student ID</label>
                    <input type="text" id="student-id"
                           placeholder="Enter student ID">
                    <p id="StudentIDError" class="error-message"></p>
                </div>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="register-email">University Email</label>
                    <input type="text" id="register-email"
                           placeholder="Enter your university email">
                    <p id="RegisterEmailError" class="error-message"></p>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="text" id="phone"
                           placeholder="Enter phone number">
                    <p id="PhoneError" class="error-message"></p>
                </div>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="department">Department</label>
                    <select id="department">
                        <option value="">Select Department</option>
                        <option value="CSE">CSE</option>
                        <option value="EEE">EEE</option>
                        <option value="BBA">BBA</option>
                        <option value="English">English</option>
                        <option value="Other">Other</option>
                    </select>
                    <p id="DepartmentError" class="error-message"></p>
                </div>

                <div class="form-group">
                    <label for="semester">Semester</label>
                    <input type="text" id="semester"
                           placeholder="Enter your semester">
                    <p id="SemesterError" class="error-message"></p>
                </div>

            </div>

            <div class="form-group">
                <label for="interest">Areas of Interest</label>
                <input type="text" id="interest"
                       placeholder="Enter your areas of interest">
                <p id="InterestError" class="error-message"></p>
            </div>

            <div class="form-group">
                <label for="reason">Reason for Joining</label>
                <textarea id="reason"
                          placeholder="Why do you want to join this club?"></textarea>
                <p id="ReasonError" class="error-message"></p>
            </div>

            <button type="submit">Register Now</button>

        </form>

        <p class="bottom-text">
            Already have an account?
            <a href="Login.html">Login Here</a>
        </p>

    </div>


</body>
</html>
