
<!DOCTYPE html>
<html>
<head>
    <title>Club Member Login</title>
    <link rel="stylesheet" href="../../css/member/member.css">
    <script src="../../js/pages/member/login.js"></script>
</head>
<body>

    <div class="login-container">

        <div class="login-header">
            <h1>Welcome Back!</h1>
            <p>Login to your Club Member Account</p>
        </div>

        <form onsubmit="return collect_login_data()">

            <label for="login-email">University Email</label>
            <input
                type="text"
                id="login-email"
                placeholder="Enter your university email">

            <p id="EmailError" class="error-message"></p>

            <label for="login-password">Password</label>
            <input
                type="password"
                id="login-password"
                placeholder="Enter your password">

            <p id="PasswordError" class="error-message"></p>

            <p id="LoginMessage" class="error-message"></p>

            <button type="submit">Login</button>

        </form>

        <p class="bottom-text">
            Don't have an account?
            <a href="registration_page.html">Register Here</a>
        </p>

    </div>


</body>
</html>
