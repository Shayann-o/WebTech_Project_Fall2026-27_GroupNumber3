
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Feedback Form</title>
    <link rel="stylesheet" href="../../css/member/member.css">
</head>
<body>

    <div class="register-container">

        <div class="register-header">
            <h2>Event Feedback Form</h2>
            <p>Share your experience and help us improve future events!</p>
        </div>

        <form>

            <div class="form-group">
                <label for="eventName">Event Name</label>
                <input type="text" id="eventName" name="eventName"
                       placeholder="Enter the event name">
            </div>

            <div class="form-group">
                <label>Overall Experience Rating</label>
                <div class="terms">
                    <label><input type="radio" name="experience" value="1"> 1 - Poor</label>
                    <label><input type="radio" name="experience" value="2"> 2 - Fair</label>
                    <label><input type="radio" name="experience" value="3"> 3 - Good</label>
                    <label><input type="radio" name="experience" value="4"> 4 - Very Good</label>
                    <label><input type="radio" name="experience" value="5"> 5 - Excellent</label>
                </div>
            </div>

            <div class="form-group">
                <label>Event Organization Rating</label>
                <div class="terms">
                    <label><input type="radio" name="organization" value="1"> 1 - Poor</label>
                    <label><input type="radio" name="organization" value="2"> 2 - Fair</label>
                    <label><input type="radio" name="organization" value="3"> 3 - Good</label>
                    <label><input type="radio" name="organization" value="4"> 4 - Very Good</label>
                    <label><input type="radio" name="organization" value="5"> 5 - Excellent</label>
                </div>
            </div>

            <div class="form-group">
                <label for="suggestions">Suggestions for Improvement</label>
                <textarea id="suggestions" name="suggestions"
                          rows="5"
                          placeholder="Share your suggestions here..."></textarea>
            </div>

            <div class="form-group">
                <label>Would You Attend Again?</label>
                <div class="terms">
                    <label>
                        <input type="radio" name="attendAgain" value="Yes">
                        Yes
                    </label>

                    <label>
                        <input type="radio" name="attendAgain" value="No">
                        No
                    </label>

                    <label>
                        <input type="radio" name="attendAgain" value="Maybe">
                        Maybe
                    </label>
                </div>
            </div>

            <button type="submit">Submit Feedback</button>

            <p class="bottom-text">
                <a href="member_dashboard.html">Back to Dashboard</a>
            </p>

        </form>

    </div>

</body>
</html>
