<!DOCTYPE html>
<html>
<head>
    <title>Update Member Profile</title>
    <link rel="stylesheet" href="../../css/member/member.css">
</head>

<body>

    <div class="register-container">

        <div class="register-header">
            <h1>Update Your Profile</h1>
            <p>Edit your personal and academic information</p>
        </div>

        <form action="#" method="post">

            <fieldset>
                <legend>Personal Information</legend>

                <div class="form-row">

                    <div class="form-group">

                        <label for="student-id">Student ID</label>

                        <input
                            type="text"
                            id="student-id"
                            name="student-id"
                            placeholder="Enter student ID">

                    </div>

                    <div class="form-group">

                        <label for="name">Full Name</label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your full name">

                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">

                        <label for="email">University Email</label>

                        <input
                            type="text"
                            id="email"
                            name="email"
                            placeholder="Enter university email">

                    </div>

                    <div class="form-group">

                        <label for="phone">Phone Number</label>

                        <input
                            type="text"
                            id="phone"
                            name="phone"
                            placeholder="Enter phone number">

                    </div>

                </div>

            </fieldset>

            <br>

            <fieldset>
                <legend>Academic Information</legend>

                <div class="form-row">

                    <div class="form-group">

                        <label for="department">Department</label>

                        <select id="department" name="department">
                            <option value="">Select Department</option>
                            <option>CSE</option>
                            <option>EEE</option>
                            <option>BBA</option>
                            <option>English</option>
                            <option>Other</option>
                        </select>

                    </div>

                    <div class="form-group">

                        <label for="semester">Semester</label>

                        <select id="semester" name="semester">
                            <option value="">Select Semester</option>
                            <option>1st Semester</option>
                            <option>2nd Semester</option>
                            <option>3rd Semester</option>
                            <option>4th Semester</option>
                            <option>5th Semester</option>
                            <option>6th Semester</option>
                            <option>7th Semester</option>
                            <option>8th Semester</option>
                            <option>9th Semester</option>
                            <option>10th Semester</option>
                            <option>11th Semester</option>
                            <option>12th Semester</option>
                        </select>

                    </div>

                </div>

            </fieldset>

            <br>

            <fieldset>
                <legend>Club Information</legend>

                <div class="form-group">

                    <label for="club">Club Name</label>

                    <select id="club" name="club">
                        <option value="">Select Club</option>
                        <option>Programming Club</option>
                        <option>Robotics Club</option>
                        <option>Business Club</option>
                        <option>Cultural Club</option>
                        <option>Photography Club</option>
                        <option>Debate Club</option>
                    </select>

                </div>

                <div class="form-group">

                    <label for="interest">Areas of Interest</label>

                    <textarea
                        id="interest"
                        name="interest"
                        placeholder="Enter your areas of interest">
                    </textarea>

                </div>

            </fieldset>

            <br>

            <button type="submit">Update Profile</button>
            <button type="reset">Reset Changes</button>

        </form>

        <p class="bottom-text">
            <a href="dashboard.html">Back to Dashboard</a>
        </p>

    </div>

</body>
</html>
