<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClubKit - Executive Login</title>
    <link rel="stylesheet" href="../../css/executive/login.css">
    <script src="../../js\pages\executive\login.js"></script>

</head>
<body>

    <div class="Container">

        <div class="box">

            <!-- Header -->
            <div class="header">

                <div class="logo">ClubKit</div>

                <span class="badge">Executive Portal</span>

                <h1>Welcome Back</h1>

                <p>Sign in to manage your university club operations</p>

            </div>


            <!-- Login Form -->
            <form action="dashboard.html" method="get" onsubmit="return validate_login()">

                <fieldset class="form-fieldset">

                    <legend>Executive Credentials</legend>


                    <!-- Executive ID -->
                    <div class="form-group">

                        <label for="execId">University Email or Student ID:</label>

                        <input
                            type="text"
                            id="execId"
                            name="execId"
                            placeholder="e.g. 24-XXXXX-X or name@aiub.edu"
                        >
                     <p id="idError" class="error"></p>
                    </div>


                    <!-- Password -->
                    <div class="form-group">

                        <label for="password">Password:</label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                        >
                    <p id="passError" class="error"></p>
                    </div>


                    <!-- Remember Me -->
                    <div class="form-options">

                        <div class="remember-me">

                            <input
                                type="checkbox"
                                id="remember"
                                name="remember"
                                value="yes"
                            >

                            <label for="remember">Keep me signed in</label>

                        </div>

                        <a href="#" class="forgot-link">Forgot password?</a>

                    </div>


                    <!-- Buttons -->
                <div class="form-actions">
                    <input type="submit" value="Login" class="btn-primary">
                    <input type="reset" value="Clear" class="btn-secondary">
                </div>

                </fieldset>

            </form>


            <!-- Footer -->
            <div class="footer">

                <p>
                    Newly elected executive?
                    <a href="registration.html">Register</a>
                </p>

            </div>

        </div>

    </div>

</body>
</html>
